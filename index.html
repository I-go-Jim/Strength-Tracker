<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17365d"><meta name="description" content="Mobile-first strength workout tracker"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css"><title>Sean's Strength Tracker</title></head><body>
<header class="app-header"><div><p class="eyebrow">12-week upper/lower program</p><h1>Strength Tracker</h1></div><button id="themeBtn" class="icon-btn" aria-label="Toggle dark mode">◐</button></header>
<main>
<section id="homeView" class="view active"><div class="week-card automatic-week-card"><div><span>Program week</span><strong id="weekNumber">Week 1</strong><small id="programStartText">Starts with first saved workout</small></div></div><h2>Current working weights</h2><div id="dashboardGrid" class="dashboard-grid"></div><h2>Choose today's workout</h2><div id="workoutButtons" class="workout-grid"></div></section>
<section id="workoutView" class="view"><div class="section-heading"><button class="back-btn" data-go="home">‹</button><div><p class="eyebrow">Today</p><h2 id="workoutTitle">Workout</h2></div></div><label class="date-label">Workout date<input id="workoutDate" type="date"></label><div id="exerciseList"></div><button id="saveWorkoutBtn" class="primary sticky-action">Save workout</button></section>
<section id="historyView" class="view"><div class="section-heading"><div><p class="eyebrow">Your data</p><h2>History</h2></div></div><div class="history-tabs"><button data-history="workouts" class="active">Workouts</button><button data-history="exercises">By exercise</button></div><div id="workoutHistoryPanel"><div class="toolbar"><button id="exportBtn" class="secondary">Export backup</button><label class="secondary file-label">Import backup<input id="importInput" type="file" accept="application/json"></label></div><div id="historyList"></div></div><div id="exerciseHistoryPanel" class="hidden"><label class="date-label">Exercise<select id="exerciseSelect"></select></label><div class="card chart-card"><canvas id="progressChart" width="700" height="300"></canvas></div><div id="exerciseStats" class="stats-grid"></div><div id="exerciseHistoryList"></div></div></section>

</main><nav class="bottom-nav" aria-label="Main navigation"><button data-view="home" class="active"><span>⌂</span>Workout</button><button data-view="history"><span>≡</span>History</button></nav><div id="toast" role="status" aria-live="polite"></div><script src="app.js"></script></body></html>
