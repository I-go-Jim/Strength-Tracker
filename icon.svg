<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f2342"/>
      <stop offset="55%" stop-color="#17365d"/>
      <stop offset="100%" stop-color="#2b5a8a"/>
    </linearGradient>
    <radialGradient id="shine" cx="50%" cy="18%" r="75%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".18"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity=".06"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#shine)"/>

  <g fill="white">
    <!-- Left plates -->
    <rect x="80" y="210" width="18" height="92" rx="4"/>
    <rect x="110" y="190" width="28" height="132" rx="4"/>

    <!-- Handle -->
    <rect x="150" y="236" width="212" height="40" rx="12"/>

    <!-- Right plates -->
    <rect x="374" y="190" width="28" height="132" rx="4"/>
    <rect x="414" y="210" width="18" height="92" rx="4"/>
  </g>
</svg>